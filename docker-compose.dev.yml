version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artwork-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artwork_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artwork_secret}
      POSTGRES_DB: ${POSTGRES_DB:-artwork_automation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artwork_user} -d ${POSTGRES_DB:-artwork_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: artwork-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: artwork-app-dev
    command: /app/scripts/dev.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES__HOST=postgres
      - POSTGRES_HOST=postgres
      - REDIS__HOST=redis
      - REDIS_HOST=redis
      - CELERY__BROKER_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY__RESULT_BACKEND=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    restart: always

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: artwork-celery-worker-dev
    command: /app/scripts/start_celery.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES__HOST=postgres
      - POSTGRES_HOST=postgres
      - REDIS__HOST=redis
      - REDIS_HOST=redis
      - CELERY__BROKER_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY__RESULT_BACKEND=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    restart: always

  celery-flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: artwork-celery-flower-dev
    command: celery -A backend.tasks.celery_app:celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - REDIS__HOST=redis
      - REDIS_HOST=redis
      - CELERY__BROKER_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY__RESULT_BACKEND=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data_dev:
  redis_data_dev:
