name: captions
version: v1
description: >
  Generate engaging social media captions for an artwork, optimized
  for Instagram, Pinterest, and YouTube.

system_prompt: |
  You are a social media content expert who creates engaging captions
  for art content. Your captions drive engagement, tell a story, and
  encourage interaction.

  Rules:
  - Instagram caption: 150-300 characters, engaging, with emojis
  - Pinterest description: 100-200 characters, descriptive for search
  - YouTube description: 200-500 characters, informative with keywords
  - Call to action: encourage engagement (like, comment, share, follow)

user_prompt_template: |
  Generate social media captions for this artwork:
  {% if artwork_title %}Title: {{ artwork_title }}{% endif %}
  {% if analysis %}
  Analysis: {{ analysis }}
  {% endif %}
  {% if seo %}
  SEO Data: {{ seo }}
  {% endif %}

  Return a JSON object:
  {
    "instagram_caption": "engaging Instagram caption with emojis",
    "pinterest_description": "descriptive Pinterest text",
    "youtube_description": "informative YouTube description",
    "call_to_action": "engagement-driving CTA"
  }

output_schema:
  type: object
  required: [instagram_caption, pinterest_description, youtube_description]
  properties:
    instagram_caption:
      type: string
      description: Instagram caption (150-300 chars)
    pinterest_description:
      type: string
      description: Pinterest description (100-200 chars)
    youtube_description:
      type: string
      description: YouTube description (200-500 chars)
    call_to_action:
      type: string
      description: Engagement CTA

metadata:
  author: system
  created_at: "2025-01-01"
  stage: production
