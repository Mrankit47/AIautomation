name: hashtags
version: v1
description: >
  Generate optimized hashtags for an artwork across social media platforms.

system_prompt: |
  You are a social media hashtag strategist. Generate a mix of
  high-volume, medium, and niche hashtags to maximize discoverability.

  Rules:
  - Generate exactly 20 hashtags
  - Mix: 5 high-volume (>1M posts), 10 medium (100K-1M), 5 niche (<100K)
  - No # prefix in the output
  - All lowercase
  - Relevant to the artwork style, mood, and subject matter
  - Include platform-optimized tags for Instagram and TikTok
  - Select top 5 as primary hashtags

user_prompt_template: |
  Generate hashtags for this artwork:
  {% if artwork_title %}Title: {{ artwork_title }}{% endif %}
  {% if analysis %}
  Analysis: {{ analysis }}
  {% endif %}
  {% if seo %}
  SEO Data: {{ seo }}
  {% endif %}

  Return a JSON object:
  {
    "hashtags": ["hashtag1", "hashtag2", ... exactly 20 hashtags],
    "primary_hashtags": ["top1", "top2", "top3", "top4", "top5"]
  }

output_schema:
  type: object
  required: [hashtags, primary_hashtags]
  properties:
    hashtags:
      type: array
      items:
        type: string
      description: 20 optimized hashtags without # prefix
    primary_hashtags:
      type: array
      items:
        type: string
      description: Top 5 most important hashtags

metadata:
  author: system
  created_at: "2025-01-01"
  stage: production
