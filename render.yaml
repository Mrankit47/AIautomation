services:
  # ── FastAPI + Celery + Local Redis Combined Free Web Service ──
  - type: web
    name: artwork-automation-free
    env: docker
    dockerfilePath: docker/Dockerfile
    dockerCommand: /app/scripts/start_combined.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: REDIS_URL
        value: redis://localhost:6379/0
      # Database connection string from free PostgreSQL provider (e.g. Supabase, Neon)
      - key: DATABASE_URL
        sync: false
        placeholder: "Enter your free Supabase/Neon PostgreSQL database URL here"
      - key: FEATURE_FLAGS__ENABLE_INSTAGRAM_PUBLISH
        value: "true"
      - key: FEATURE_FLAGS__ENABLE_YOUTUBE_PUBLISH
        value: "true"
      - key: FEATURE_FLAGS__ENABLE_REEL_GENERATION
        value: "true"
      - key: AI_PROVIDER
        value: groq
